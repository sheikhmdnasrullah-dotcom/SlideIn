# Forced resolver for the isolated lab.
# 127.0.0.11 is Docker's embedded DNS, which resolves in-network
# service aliases (sink.lab.internal, etc.) but cannot reach the
# public Internet from the `lab-isolated` network. This keeps the
# lab hermetically sealed: KumoMTA can only ever talk to the sink MX.
nameserver 127.0.0.11
options ndots:0
