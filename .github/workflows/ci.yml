name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go — format, vet, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(find . -name '*.go' \
            -not -path './workspace-app/*' \
            -not -path './kumomta-src/*' \
            -not -path '*/node_modules/*' \
            -not -path './venv/*' \
            -not -path './venv_product/*' \
            -not -path './.venv/*' \
            -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  python:
    name: Python — deliverability & lab tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Deliverability unit tests
        run: python -m unittest discover -s deliverability/tests -p "test_*.py" -v

      - name: KumoMTA lab tests (integration cases auto-skip)
        run: python -m pytest kumomta-lab/tests -q

  product-api:
    name: Product API — security & contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acquisition
          POSTGRES_PASSWORD: acquisition
          POSTGRES_DB: acquisition_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://acquisition:acquisition@localhost:5432/acquisition_os
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install product dependencies
        run: pip install -r product/requirements.txt

      # test_workflows.py is Agent 2's in-flight DB workflow suite: it needs
      # auth headers and a seeded test DB. Re-enable once it is completed.
      - name: Product API tests
        run: python -m pytest product/tests -q --ignore=product/tests/test_workflows.py

  security:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure no secrets are tracked by git
        run: bash scripts/check-secrets.sh
